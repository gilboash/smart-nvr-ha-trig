services:
  smart-nvr:
    build: .
    image: naco-real-smart-nvr:latest
    container_name: naco-real-smart-nvr
    restart: unless-stopped
    ports:
      - "7070:7070"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - ./config/models:/models
      - model_cache:/root/.cache
      - ./.env:/app/.env
    environment:
      SNVR_HOST: 0.0.0.0
      SNVR_PORT: "7070"
      SNVR_DB_PATH: /data/snvr.db
      SNVR_SNAPSHOT_DIR: /data/snapshots
      SNVR_CLIPS_DIR: /data/clips
      SNVR_RECORDINGS_DIR: /data/recordings
      SNVR_MODEL_DIR: /models
      SNVR_LOG_LEVEL: INFO
      SNVR_DEVICE: "${SNVR_DEVICE:-cuda:0}"
      # Decode on the GPU's NVDEC block instead of in-process in Python.
      # Requires 'video' in NVIDIA_DRIVER_CAPABILITIES below.
      SNVR_CAPTURE_BACKEND: "${SNVR_CAPTURE_BACKEND:-ffmpeg}"
      SNVR_CAPTURE_HWACCEL: "${SNVR_CAPTURE_HWACCEL:-cuda}"
      SNVR_CAPTURE_WIDTH: "${SNVR_CAPTURE_WIDTH:-0}"
      # Segment encoding: h264_nvenc moves it off the CPU entirely.
      SNVR_RECORDING_ENCODER: "${SNVR_RECORDING_ENCODER:-h264_nvenc}"
      SNVR_RECORDING_ENCODE_THREADS: "${SNVR_RECORDING_ENCODE_THREADS:-2}"
      # compute,utility alone does NOT expose libnvcuvid — NVDEC needs 'video'.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Keep large frame buffers on mmap so they return to the OS on free,
      # instead of fragmenting glibc arenas and inflating RSS over weeks.
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_ARENA_MAX: "2"
    # Contain the NVR so an OOM here cannot take down the WSL VM (and anything
    # else sharing this host) with it. restart: unless-stopped brings it back.
    mem_limit: 6500m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_cache:
